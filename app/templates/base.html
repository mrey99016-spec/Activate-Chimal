<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07172f">
  <title>{% block title %}Actívate Chimal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<header class="navbar">
  <a href="{{ url_for('main.dashboard') }}" class="logo">
    <span class="logo-icon">⚡</span>
    ACTÍVATE <span>CHIMAL</span>
  </a>

  <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>

  <nav class="nav-links" id="menu">
    <a href="{{ url_for('main.dashboard') }}">Inicio</a>
    <a href="{{ url_for('main.canchas') }}">Canchas</a>
    <a href="{{ url_for('main.retos') }}">Retos</a>
    <a href="{{ url_for('main.comunidad') }}">Comunidad</a>
    <a href="{{ url_for('profile.perfil') }}">Perfil</a>
    <a href="{{ url_for('auth.logout') }}">Salir</a>
  </nav>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>Actívate Chimal • Chimalhuacán • Hecho con 💚</p>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
